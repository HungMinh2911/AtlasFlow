spring:
  application:
    name: atlasflow-backend

  profiles:
    default: local

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/atlasflow}
    username: ${DB_USERNAME:atlasflow}
    password: ${DB_PASSWORD:local-dev-only-password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  hikari:
    maximum-pool-size: 10 # Số connection tối đa
    minimum-idle: 2 # Số connection nhàn rỗi tối thiểu

    connection-timeout: 30000 # Thời gian chờ lấy connection
    validation-timeout: 5000 # thời gian chờ xác thực

    idle-timeout: 600000 # Connection idle bao lâu thì có thể bị đóng
    max-lifetime: 1800000 # Tuổi thọ tối đa của connection

    pool-name: AtlasFlowHikariPool # Tên pool

jwt:
  secret: ${JWT_SECRET:QXRsYXNGbG93U2VjcmV0S2V5Rm9ySnd0QXV0aGVudGljYXRpb24yMDI2U2VjdXJl}
  issuer: ${JWT_ISSUER:atlasflow_backend}
  audience: ${JWT_AUDIENCE:atlasflow-api}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

app:
  cors:
    allowed-origins: "https://app.atlasflow.com,http://localhost:3000"


atlasflow:
  storage:
    local-root: ${ATLASFLOW_STORAGE_ROOT:storage/files}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
