spring:
  application:
    name: atlasflow-backend

  profiles:
    default: local

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/atlasflow}
    username: ${DB_USERNAME:atlasflow}
    password: ${DB_PASSWORD:local-dev-only-password}

atlasflow:
  storage:
    local-root: ${ATLASFLOW_STORAGE_ROOT:storage/files}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
